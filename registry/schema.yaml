# Fields for registry/servers/*.yaml
name:          {required: true,  type: str,  desc: "short slug, matches the filename"}
repo:          {required: true,  type: str,  desc: "owner/name on GitHub"}
language:      {required: true,  type: str,  enum: [python, typescript, go, rust, java, csharp, ruby, other]}
grade:         {required: true,  type: str,  enum: [A, B, C, D, F]}
score:         {required: true,  type: int,  range: [0, 100]}
suppressed:    {required: false, type: int,  desc: "non-negative count of findings suppressed when the grade was computed"}
disabled_rules:{required: false, type: list, desc: "list of rule IDs switched off by project config"}
checked_with:  {required: true,  type: str,  desc: "mcp-migrate <version>"}
spec:          {required: true,  type: str,  desc: "spec revision checked against"}
# The commit `repo` was at when this entry was graded. Without it, `repo`
# names a moving target and a published grade can never be checked against
# the thing it was actually a claim about -- see #223. Optional because the
# 16 entries that predate this field can't be invalidated by its landing,
# and because `mcp-migrate entry` can only fill it in when the tree it
# scanned is a git checkout in the first place.
sha:           {required: false, type: str,  desc: "commit SHA the entry was graded against, 7-40 hex chars"}
status:        {required: true,  type: str,  enum: [ready, migrating, unmaintained]}
notes:         {required: true,  type: str,  desc: "one sentence, what it does"}
homepage:      {required: false, type: str}
# Subdirectory that was actually scanned, when `repo` is a monorepo. Without
# it the entry is not reproducible: `awslabs/mcp` holds 62 servers, and
# checking the repo root scores it F/0 -- which is what happened when these
# grades were first re-verified. A published grade nobody else can reproduce
# is not a measurement, it is an assertion.
path:          {required: false, type: str,  desc: "subdir scanned, if repo is a monorepo"}
# Who put this entry here. "project" means mcp-migrate scanned a public repo
# and wrote the entry; "owner" means someone who maintains that server
# submitted it themselves. The distinction is the whole value of the board --
# a list we compiled is a survey, a list projects opted into is adoption, and
# conflating the two would be the same kind of overclaiming this tool exists
# to refuse. Defaults to "project", because that is what an unmarked entry is.
submitted_by:  {required: false, type: str,  enum: [project, owner]}
