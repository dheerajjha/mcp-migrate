name: Board

on:
  push:
    branches: [main]
    paths:
      # The data, and everything that decides how the data renders. Watching
      # `registry/**` alone was wrong in a way that hid itself: change a
      # colour or a row format and the workflow never fires, so the committed
      # board and badges keep serving the *old* rendering with no diff, no
      # failure, and nothing to notice. #226 changed the grade colours and
      # would have left all 16 badge endpoints stale exactly this way.
      - "registry/**"
      - "scripts/render_board.py"
      - "scripts/render_badges.py"
      - "scripts/validate_registry.py"
      - "src/mcp_migrate/constants.py"
      - ".github/workflows/board.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_registry.py

      - name: Render board into README
        run: python scripts/render_board.py

      - name: Render live badge endpoints
        run: python scripts/render_badges.py

      - name: Commit board update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/badge
          if git diff --cached --quiet; then
            echo "Board and badges unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: regenerate board and badge endpoints [skip ci]"
          git push
