name: Board

on:
  push:
    branches: [main]
    paths:
      - "registry/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_registry.py

      - name: Render board into README
        run: python scripts/render_board.py

      - name: Commit board update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Board unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: regenerate board [skip ci]"
          git push
