name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync project
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Validate registry
        # Authenticated so the language check isn't rate-limited: hosted
        # runners share outbound IPs, and unauthenticated GitHub API calls
        # are capped at 60/hour per IP. Without this the check would skip
        # itself on busy days, which is the one time it matters.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/validate_registry.py
